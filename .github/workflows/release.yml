name: Release

# Push a tag like v1.0.1 (it must match "version" in manifest.json) to build the exe and
# publish a GitHub release with the ready-to-import Pal Engine plugin zip.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check tag matches manifest version
        shell: pwsh
        run: |
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match manifest.json version $version"
          }

      - name: Build plugin zip
        shell: pwsh
        run: ./build_exe.ps1 -Clean -Python python

      - name: Smoke test
        shell: pwsh
        run: |
          # Read all output first: cutting the pipe early (Select-Object -First) breaks the exe's stdout.
          $voices = ./dist/TikTokVoiceTTS.exe --list-voices
          if ($LASTEXITCODE -ne 0) { throw "--list-voices failed" }
          "$($voices.Count) voices"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
